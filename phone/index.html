<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Instagram Agent</title>
<style>
  :root{--bg:#0b0b0f;--ink:#fff;--mut:#a8a8b3}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1c1c24;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
  .phone{width:390px;height:800px;max-width:100vw;max-height:100vh;background:var(--bg);color:var(--ink);border-radius:46px;border:10px solid #000;box-shadow:0 20px 60px #000a;position:relative;overflow:hidden;display:flex;flex-direction:column}
  .notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:110px;height:26px;background:#000;border-radius:20px;z-index:5}
  header{padding:44px 18px 10px;display:flex;justify-content:space-between;align-items:center}
  header h1{margin:0;font:600 26px "Snell Roundhand","Brush Script MT",cursive}
  .stories{display:flex;gap:12px;padding:6px 18px 12px;overflow-x:auto;scrollbar-width:none}
  .story{flex:none;width:62px;text-align:center;font-size:11px;color:var(--mut)}
  .ring{width:62px;height:62px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}
  .ring div{width:100%;height:100%;border-radius:50%;background:#222;border:3px solid var(--bg);display:grid;place-items:center;font-size:24px}
  h2{margin:4px 18px 8px;font-size:13px;color:var(--mut);font-weight:500;text-transform:uppercase;letter-spacing:.08em}
  .grid{flex:1;overflow-y:auto;padding:0 14px 14px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-content:start}
  .tile{aspect-ratio:1;border:0;border-radius:18px;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:600 11px inherit;border-radius:16px;transition:transform .12s}
  .tile:active{transform:scale(.94)}
  .tile span{font-size:24px}
  nav{display:flex;justify-content:space-around;padding:12px 0 18px;border-top:1px solid #222;font-size:22px}
  .sheet{position:absolute;inset:auto 0 0 0;background:#1a1a22;border-radius:26px 26px 0 0;padding:18px;transform:translateY(105%);transition:transform .25s;z-index:6}
  .sheet.open{transform:none}
  .sheet h3{margin:0 0 4px}.sheet p{margin:0 0 12px;color:var(--mut);font-size:13px}
  textarea{width:100%;height:90px;border-radius:12px;border:1px solid #333;background:#0f0f14;color:#fff;padding:10px;font:14px inherit;resize:none}
  code{display:block;max-height:220px;overflow-y:auto;white-space:pre-wrap;margin:10px 0;padding:10px;border-radius:10px;background:#000;color:#8ef;font-size:12px;word-break:break-all}
  .row{display:flex;gap:8px}
  .row button{flex:1;padding:12px;border:0;border-radius:12px;font-weight:600;cursor:pointer}
  .go{background:#0095f6;color:#fff}.x{background:#333;color:#fff}
  .toast{position:absolute;top:104px;left:50%;transform:translateX(-50%);background:#2ecc71;color:#000;padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;transition:.2s;z-index:9}
  .toast.show{opacity:1}
  .tile,.story{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
  .info{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);width:300px;background:#1a1a22;border:1px solid #333;border-radius:20px;padding:18px;z-index:10;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 10px 30px #000c}
  .info.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .info h4{margin:0 0 6px;font-size:16px}
  .info p{margin:0;color:#ddd;font-size:13px;line-height:1.45}
  .info small{display:block;margin-top:10px;color:var(--mut);font-size:11px}
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="toast" id="toast">Commande copiée ✓</div>
  <header><h1>Instagram</h1><span>♡ ✉</span></header>
  <div class="stories" id="stories"></div>
  <h2>Mes 13 skills</h2>
  <div class="grid" id="grid"></div>
  <nav><span>🏠</span><span>🔍</span><span>➕</span><span>🎬</span><span>👤</span></nav>

  <div class="info" id="info"><h4 id="iTitle"></h4><p id="iText"></p><small>Relâche pour fermer</small></div>

  <div class="sheet" id="sheet">
    <h3 id="sTitle"></h3><p id="sDesc"></p>
    <textarea id="sInput" placeholder="Ton sujet / ton texte à coller (optionnel)"></textarea>
    <code id="sCmd"></code>
    <div class="row"><button class="x" id="sClose">Fermer</button><button class="go" id="sCopy">Copier la commande</button></div>
  </div>
</div>

<script>
// Serveur local optionnel (voir server.py) : si présent, le clic LANCE vraiment la commande.
const SKILLS=[
 ["ig-reel","🎬","Reel","Script de Reel : hooks, texte, beat sheet","linear-gradient(135deg,#f09433,#dc2743)"],
 ["ig-caption","✍️","Caption","Légende + hashtags, vérifiée","linear-gradient(135deg,#dc2743,#bc1888)"],
 ["ig-carousel","🎠","Carrousel","Slides 1080x1350","linear-gradient(135deg,#bc1888,#6a2fbf)"],
 ["ig-story","⭕","Story","Séquence de stories + stickers","linear-gradient(135deg,#f09433,#e6683c)"],
 ["ig-plan","📅","Plan","Ta semaine de contenu","linear-gradient(135deg,#4f5bd5,#962fbf)"],
 ["ig-profile","👤","Profil","Score /100 + bio réécrite","linear-gradient(135deg,#2193b0,#4f5bd5)"],
 ["ig-viral","🔥","Viral","Reels qui marchent dans ta niche","linear-gradient(135deg,#ff512f,#dd2476)"],
 ["ig-audit","📊","Audit","Ce qui marche / ne marche pas","linear-gradient(135deg,#11998e,#38ef7d)"],
 ["ig-comment","💬","Comment","Commentaires qui sonnent humain","linear-gradient(135deg,#00c6ff,#0072ff)"],
 ["ig-reply","↩️","Reply","Répondre à tes commentaires","linear-gradient(135deg,#7f00ff,#e100ff)"],
 ["ig-dm","✉️","DM","Messages privés qui obtiennent réponse","linear-gradient(135deg,#f7971e,#ffd200)"],
 ["ig-repurpose","♻️","Repurpose","Vidéo/podcast → semaine de posts","linear-gradient(135deg,#56ab2f,#a8e063)"],
 ["ig-human","🧑","Humaniser","Enlève l'empreinte IA d'un texte","linear-gradient(135deg,#606c88,#3f4c6b)"],
 ["viral-studio","🎯","Studio","Trouve les vidéos qui marchent et crée des capsules","linear-gradient(135deg,#fd5949,#d6249f)"]
];
// Explication simple affichée après un appui long de 3 secondes
const INFO={
 "ig-reel":"Crée un Reel complet : l'accroche qui retient, le texte à dire, le texte à l'écran et le découpage seconde par seconde.",
 "ig-caption":"Écrit la légende de ta publication avec les hashtags, puis vérifie qu'elle reste lisible avant d'être publiée.",
 "ig-carousel":"Crée un carrousel : une couverture qui donne envie de swiper, et le texte de chaque diapositive.",
 "ig-story":"Prépare la suite de tes stories du jour, avec les stickers à utiliser à chaque étape.",
 "ig-plan":"Organise ta semaine : quoi publier, dans quel format, à quelle heure, et qui commenter.",
 "ig-profile":"Note ton profil sur 100, puis réécrit la bio et les parties qui te font perdre des points.",
 "ig-viral":"Trouve les Reels qui marchent en ce moment dans ta niche et explique pourquoi ils marchent.",
 "ig-audit":"Analyse tes anciennes publications : ce qui a marché, ce qui a raté, et ce qu'il faut arrêter.",
 "ig-comment":"Écrit des commentaires naturels à laisser sous les publications d'autres personnes.",
 "ig-reply":"Rédige les réponses aux commentaires sous tes propres publications, en triant ceux qui valent une réponse.",
 "ig-dm":"Écrit des messages privés qui obtiennent une réponse, y compris pour proposer une collaboration.",
 "ig-repurpose":"Transforme une vidéo, un podcast ou un article long en une semaine de Reels et de carrousels.",
 "ig-human":"Enlève les tics d'IA d'un texte (tirets longs, mots typiques) pour qu'il sonne naturel.",
 "viral-studio":"Trouve les vidéos qui marchent dans ta niche, les trie, puis écrit des scripts et des idées de capsules pour Instagram et TikTok."
};
const $=id=>document.getElementById(id);
let cur=null;
// Appui long (3 s) : affiche l'explication. Un clic court ouvre le panneau comme avant.
function bindPress(el,s){
  let timer=null,fired=false;
  const stop=()=>{clearTimeout(timer);timer=null};
  el.addEventListener("pointerdown",()=>{fired=false;stop();timer=setTimeout(()=>{fired=true;showInfo(s)},3000)});
  el.addEventListener("pointerup",stop);
  el.addEventListener("pointerleave",stop);
  el.addEventListener("pointercancel",stop);
  el.addEventListener("contextmenu",e=>e.preventDefault());
  el.addEventListener("click",e=>{if(fired){fired=false;e.stopImmediatePropagation();e.preventDefault();return}openSheet(s)},true);
}
function showInfo(s){$("iTitle").textContent=s[1]+" "+s[2];$("iText").textContent=INFO[s[0]];$("info").classList.add("show");setTimeout(hideInfo,6000)}
function hideInfo(){$("info").classList.remove("show")}
$("info").addEventListener("pointerdown",hideInfo);
SKILLS.forEach(s=>{
  const b=document.createElement("button");b.className="tile";b.style.background=s[4];
  b.innerHTML=`<span>${s[1]}</span>${s[2]}`;$("grid").appendChild(b);bindPress(b,s);
  const st=document.createElement("div");st.className="story";
  st.innerHTML=`<div class="ring"><div>${s[1]}</div></div>${s[2]}`;$("stories").appendChild(st);bindPress(st,s);
});
function cmd(){const t=$("sInput").value.trim();return `/${cur[0]}`+(t?` ${t}`:"")}
function refresh(){$("sCmd").textContent=cmd()}
function openSheet(s){cur=s;$("sTitle").textContent=s[1]+" "+s[2];$("sDesc").textContent=s[3];$("sInput").value="";refresh();$("sheet").classList.add("open")}
$("sInput").oninput=refresh;
$("sClose").onclick=()=>$("sheet").classList.remove("open");
$("sCopy").onclick=async()=>{
  const c=cmd();
  $("sCopy").disabled=true;$("sCopy").textContent="⏳ En cours…";
  // 1) tente de lancer via le serveur local ; 2) sinon copie dans le presse-papiers
  if(location.protocol!=="file:")try{
    const r=await fetch("/run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({command:c})});
    if(r.ok){const j=await r.json();$("sCmd").textContent=j.output;$("sCopy").disabled=false;$("sCopy").textContent="Relancer";return}
  }catch(e){}
  $("sCopy").disabled=false;$("sCopy").textContent="Copier la commande";
  try{await navigator.clipboard.writeText(c)}catch(e){}
  $("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1500);
};
</script>
</body>
</html>
